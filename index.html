<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle da Van</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101318;color:#f1f5f9;font-family:Arial,sans-serif}
.container{max-width:560px;margin:auto;padding:20px}
h1{text-align:center;margin:8px 0 4px;font-size:28px}
.subtitle{text-align:center;color:#aab4c3;margin-bottom:20px}
.card{background:#1b222c;border-radius:18px;padding:18px;margin-bottom:16px}
label{display:block;color:#aab4c3;margin:12px 0 6px}
input,select{width:100%;padding:13px;border:1px solid #394454;border-radius:10px;background:#101318;color:white;font-size:16px}
button{cursor:pointer}
.primary{width:100%;padding:14px;border:0;border-radius:10px;background:#16a36b;color:white;font-size:16px;font-weight:bold;margin-top:16px}
.primary:hover{background:#138b5b}
.primary:disabled{opacity:.6;cursor:not-allowed}
.secondary{width:100%;padding:13px;border:0;border-radius:10px;background:#303946;color:white;font-size:15px;margin-top:10px}
.summary{text-align:center;color:#6ee7b7;font-size:22px;font-weight:bold;padding-bottom:18px}
.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{text-align:center;color:#94a3b8;padding:5px}
.day{border:0;border-radius:10px;background:#111821;color:white;min-height:48px;font-size:15px}
.day.selected{background:#16a36b;font-weight:bold}
.day.empty{visibility:hidden}
.status{text-align:center;margin-top:12px;font-size:14px;min-height:20px;overflow-wrap:anywhere}
.note{text-align:center;color:#718096;font-size:12px;margin-top:14px}
.hidden{display:none!important}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.topline .secondary{width:auto;margin:0;padding:10px 12px}
.small{font-size:13px;color:#aab4c3;overflow-wrap:anywhere}
h2{font-size:20px;margin:0 0 8px}
</style>
</head>
<body>
<div class="container">
  <h1>🚐 Controle da Van</h1>
  <p class="subtitle">Marque os dias em que você utilizou a van.</p>

  <section id="loginCard" class="card">
    <h2>Entrar</h2>
    <p class="small">Entre com o e-mail e a senha cadastrados no sistema.</p>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" placeholder="seuemail@exemplo.com">
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" placeholder="Sua senha">
    <button id="entrar" class="primary">Entrar</button>
    <div id="loginStatus" class="status" role="status"></div>
    <p class="note">A conta deve ser criada no Supabase pelo administrador.</p>
  </section>

  <section id="appArea" class="hidden">
    <div class="topline">
      <div class="small">Conectado como <strong id="emailLogado"></strong></div>
      <button id="sair" class="secondary">Sair</button>
    </div>
    <div class="card">
      <label for="usuario">Nome para identificação</label>
      <input id="usuario" type="text" placeholder="Digite seu nome">
      <label for="valor">Valor da van por dia (R$)</label>
      <input id="valor" type="number" step="0.01" min="0" placeholder="Ex.: 10,00">
      <label for="mes">Mês</label>
      <select id="mes"></select>
      <label for="ano">Ano</label>
      <input id="ano" type="number" min="2000" max="2100">
    </div>
    <div class="card">
      <div id="resumo" class="summary">0 dias • R$ 0,00</div>
      <div class="week"><div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div></div>
      <div id="calendario" class="calendar"></div>
      <button id="salvar" class="primary">Salvar registro</button>
      <div id="status" class="status" role="status"></div>
    </div>
    <button id="limpar" class="secondary">Limpar marcações deste mês</button>
    <div class="note">Os registros são associados à conta autenticada.</div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  // A chave publishable/anon é feita para uso no navegador. A segurança depende das políticas RLS.
  const SUPABASE_URL = "https://ioyytfxplwtwtejtvwss.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Anm5GDdl4ajPU8GlVaaRRQ_A9ioBcMn";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const $ = id => document.getElementById(id);
  const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  meses.forEach((nome,i) => { const o=document.createElement("option"); o.value=i+1; o.textContent=nome; $("mes").appendChild(o); });
  const agora = new Date();
  $("mes").value = String(agora.getMonth()+1);
  $("ano").value = agora.getFullYear();

  let session = null;
  let diasAtuais = new Set();
  let carregando = false;

  function moeda(n) {
    return Number(n || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  }
  function mensagem(texto, area="status") { $(area).textContent = texto; }
  function renderizar() {
    const anoSel = parseInt($("ano").value,10) || agora.getFullYear();
    const mesSel = (parseInt($("mes").value,10) || 1)-1;
    $("calendario").innerHTML = "";
    const primeiro = new Date(anoSel,mesSel,1).getDay();
    const qtd = new Date(anoSel,mesSel+1,0).getDate();
    for(let i=0;i<primeiro;i++){const b=document.createElement("button");b.className="day empty";b.disabled=true;$("calendario").appendChild(b);}
    for(let dia=1;dia<=qtd;dia++){
      const b=document.createElement("button");b.className="day";b.textContent=dia;
      if(diasAtuais.has(dia)) b.classList.add("selected");
      b.disabled=carregando;
      b.addEventListener("click",()=>{if(diasAtuais.has(dia))diasAtuais.delete(dia);else diasAtuais.add(dia);renderizar();});
      $("calendario").appendChild(b);
    }
    const valorDia = parseFloat(String($("valor").value).replace(",", ".")) || 0;
    $("resumo").textContent = `${diasAtuais.size} dias • ${moeda(diasAtuais.size*valorDia)}`;
  }
  function setApp(user) {
    session = user ? {user} : null;
    $("loginCard").classList.toggle("hidden",!!user);
    $("appArea").classList.toggle("hidden",!user);
    $("emailLogado").textContent = user ? user.email : "";
    if(!user){diasAtuais=new Set();$("senha").value="";return;}
  }
  async function carregar() {
    if(!session) return;
    carregando=true; renderizar(); mensagem("Carregando registro...");
    const uid=session.user.id, anoSel=Number($("ano").value), mesSel=Number($("mes").value);
    try {
      const {data,error}=await db.from("van_registros")
        .select("id,usuario,valor_dia,dias")
        .eq("usuario_id",uid).eq("ano",anoSel).eq("mes",mesSel).maybeSingle();
      if(error) throw error;
      if(data){
        $("usuario").value=data.usuario || "";
        $("valor").value=data.valor_dia ?? "";
        diasAtuais=new Set(Array.isArray(data.dias)?data.dias.map(Number):[]);
        mensagem("Registro carregado.");
      } else {
        diasAtuais=new Set();
        mensagem("Nenhum registro salvo para este mês.");
      }
    } catch(e) {
      console.error(e); diasAtuais=new Set();
      mensagem("Não foi possível carregar. Confira as políticas RLS e tente novamente.");
    } finally { carregando=false; renderizar(); }
  }
  $("entrar").addEventListener("click",async()=>{
    const email=$("email").value.trim(), password=$("senha").value;
    if(!email||!password){mensagem("Digite o e-mail e a senha.","loginStatus");return;}
    $("entrar").disabled=true;mensagem("Entrando...","loginStatus");
    try{
      const {data,error}=await db.auth.signInWithPassword({email,password});
      if(error) throw error;
      setApp(data.user); mensagem("","loginStatus"); await carregar();
    }catch(e){console.error(e);mensagem("Não foi possível entrar. Confira o e-mail e a senha.","loginStatus");}
    finally{$("entrar").disabled=false;}
  });
  $("senha").addEventListener("keydown",e=>{if(e.key==="Enter")$("entrar").click();});
  $("sair").addEventListener("click",async()=>{
    const {error}=await db.auth.signOut();
    if(error){console.error(error);mensagem("Erro ao sair.");return;}
    setApp(null);mensagem("Você saiu da conta.","loginStatus");
  });
  $("usuario").addEventListener("input",()=>{});
  $("valor").addEventListener("input",renderizar);
  $("mes").addEventListener("change",carregar);
  $("ano").addEventListener("change",carregar);
  $("salvar").addEventListener("click",async()=>{
    if(!session)return;
    const nome=$("usuario").value.trim();
    const anoSel=Number($("ano").value), mesSel=Number($("mes").value);
    const valorDia=parseFloat(String($("valor").value).replace(",", "."))||0;
    const dias=[...diasAtuais].sort((a,b)=>a-b);
    if(!nome){mensagem("Digite seu nome.");return;}
    if(valorDia<=0){mensagem("Digite um valor diário maior que zero.");return;}
    if(dias.length===0){mensagem("Marque pelo menos um dia.");return;}
    $("salvar").disabled=true;mensagem("Salvando...");
    try{
      const payload={usuario_id:session.user.id,usuario:nome,ano:anoSel,mes:mesSel,valor_dia:valorDia,dias};
      const {error}=await db.from("van_registros").upsert(payload,{onConflict:"usuario_id,ano,mes"});
      if(error) throw error;
      mensagem("Registro salvo com sucesso!");
    }catch(e){
      console.error(e);
      if(e.code==="23505"||String(e.message||"").includes("onConflict")){
        mensagem("O banco precisa de uma chave única para usuário, ano e mês. Avise-me para configurarmos.");
      } else {
        mensagem("Erro ao salvar. Confira a conexão e as políticas RLS.");
      }
    }finally{$("salvar").disabled=false;}
  });
  $("limpar").addEventListener("click",async()=>{
    if(!session)return;
    if(!confirm("Excluir o registro deste mês?"))return;
    mensagem("Excluindo...");
    try{
      const {error}=await db.from("van_registros").delete()
        .eq("usuario_id",session.user.id).eq("ano",Number($("ano").value)).eq("mes",Number($("mes").value));
      if(error)throw error;
      diasAtuais=new Set();renderizar();mensagem("Registro excluído.");
    }catch(e){console.error(e);mensagem("Erro ao excluir. Confira as políticas RLS.");}
  });

  (async()=>{
    const {data,error}=await db.auth.getSession();
    if(error){console.error(error);return;}
    if(data.session){setApp(data.session.user);await carregar();}
    else setApp(null);
    renderizar();
  })();
})();
</script>
</body>
</html>
